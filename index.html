<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solkrogen - Booking</title>
    <style>
        :root {
            --color-lene: #f1f3f5;
            --color-erik: #f3f0ff;
            --color-anne: #ebfbee;
            --border-lene: #adb5bd;
            --border-erik: #b197fc;
            --border-anne: #8ce99a;
            --bg-color: #f4f6f8;
            --card-bg: #ffffff;
            --text-color: #212529;
            --primary: #2b8a3e;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px 20px 90px 20px;
            display: flex;
            justify-content: center;
        }

        .app-container {
            width: 100%;
            max-width: 440px;
            background: var(--card-bg);
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            overflow: hidden;
            box-sizing: border-box;
        }

        .app-header-image {
            width: 100%;
            height: 180px;
            object-fit: cover;
        }

        .app-content {
            padding: 24px;
        }

        h1 {
            font-size: 1.6rem;
            margin: 0 0 4px 0;
            text-align: center;
            letter-spacing: -0.5px;
        }

        p.subtitle {
            text-align: center;
            color: #868e96;
            font-size: 0.9rem;
            margin: 0 0 24px 0;
        }

        .view-section {
            display: none;
        }
        .view-section.active {
            display: block;
        }

        .month-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .month-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: #343a40;
        }

        .month-btn {
            background: #f1f3f5;
            border: none;
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            color: #495057;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 6px;
            margin-bottom: 24px;
        }

        .cal-header-day {
            text-align: center;
            font-size: 0.75rem;
            font-weight: 600;
            color: #adb5bd;
            padding-bottom: 4px;
        }

        .cal-day {
            aspect-ratio: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 10px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            border: 1px solid rgba(0,0,0,0.04);
            transition: transform 0.1s ease;
        }

        .cal-day:active {
            transform: scale(0.92);
        }

        .owner-lene { background-color: var(--color-lene); border-color: var(--border-lene); color: #495057; }
        .owner-erik { background-color: var(--color-erik); border-color: var(--border-erik); color: #5f3dc4; }
        .owner-anne { background-color: var(--color-anne); border-color: var(--border-anne); color: #2b8a3e; }
        .cal-day.empty { background: none; border: none; cursor: default; }

        .cal-day.booked-erik { background-color: #d8b4fe !important; border-color: #9333ea !important; color: #581c87 !important; }
        .cal-day.booked-anne { background-color: #86efac !important; border-color: #16a34a !important; color: #14532d !important; }
        .cal-day.booked-lene { background-color: #cbd5e1 !important; border-color: #475569 !important; color: #1e293b !important; }

        .day-number { font-size: 0.9rem; }
        .day-owner { font-size: 0.50rem; opacity: 0.85; text-transform: uppercase; letter-spacing: 0.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; width: 100%; text-align: center; }

        .legend {
            display: flex;
            justify-content: space-between;
            background: #f8f9fa;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 0.75rem;
            margin-bottom: 24px;
            font-weight: 500;
            color: #495057;
        }
        .legend-item { display: flex; align-items: center; gap: 6px; }
        .legend-box { width: 10px; height: 10px; border-radius: 50%; }

        .bookings-list-title {
            font-size: 1rem;
            font-weight: 700;
            margin: 20px 0 10px 0;
            color: #343a40;
        }
        .booking-card {
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 8px;
            font-size: 0.85rem;
        }

        .checklist-category {
            font-size: 1rem;
            font-weight: 700;
            margin: 24px 0 12px 0;
            color: #343a40;
        }

        .checklist-item {
            display: flex;
            align-items: flex-start;
            background: #f8f9fa;
            padding: 14px;
            border-radius: 12px;
            margin-bottom: 10px;
            cursor: pointer;
            font-size: 0.9rem;
            line-height: 1.4;
            border: 1px solid #e9ecef;
        }

        .checklist-item input {
            margin-right: 14px;
            margin-top: 2px;
            width: 18px;
            height: 18px;
            accent-color: #2b8a3e;
            cursor: pointer;
            flex-shrink: 0;
        }

        .checklist-item.completed span {
            text-decoration: line-through;
            color: #adb5bd;
        }

        .nav-bar {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 440px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: space-around;
            padding: 12px 0;
            border-top: 1px solid #e9ecef;
            z-index: 50;
        }

        .nav-item {
            background: none;
            border: none;
            font-size: 0.8rem;
            font-weight: 600;
            color: #adb5bd;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .nav-item svg {
            width: 22px;
            height: 22px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .nav-item.active {
            color: #2b8a3e;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(4px);
            justify-content: center;
            align-items: flex-end;
            z-index: 100;
        }

        .modal-content {
            background: white;
            width: 100%;
            max-width: 440px;
            border-radius: 24px 24px 0 0;
            padding: 24px;
            box-sizing: border-box;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-content h3 {
            margin-top: 0;
            font-size: 1.2rem;
        }

        label {
            font-size: 0.8rem;
            font-weight: 700;
            color: #868e96;
            display: block;
            margin-top: 16px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input[type="text"], input[type="date"], select {
            width: 100%;
            padding: 12px;
            margin: 6px 0 4px 0;
            border: 1px solid #ced4da;
            border-radius: 12px;
            box-sizing: border-box;
            font-size: 1rem;
            background: #f8f9fa;
        }

        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            color: white;
            margin-top: 16px;
        }

        .btn-book { background-color: #2b8a3e; }
        .btn-request { background-color: #f59f00; color: #fff; }
        .btn-close { background-color: #f1f3f5; color: #495057; margin-top: 8px; }
    </style>
</head>
<body>

    <div class="app-container">
        
        <img src="hus.jpg" alt="Solkrogen luftfoto" class="app-header-image">

        <div class="app-content">
            <!-- KALENDER VIEW -->
            <div id="calendarView" class="view-section active">
                <h1>Solkrogen</h1>
                <p class="subtitle">Familiebooker & Oversigt</p>

                <button class="btn btn-book" onclick="openModal()" style="margin-bottom: 24px;">+ Opret booking / anmodning</button>

                <div class="month-nav">
                    <button class="month-btn" onclick="changeMonth(-1)">‹ Forrige</button>
                    <div class="month-title" id="monthTitle">September 2026</div>
                    <button class="month-btn" onclick="changeMonth(1)">Næste ›</button>
                </div>

                <div class="legend">
                    <div class="legend-item"><div class="legend-box" style="background:#b197fc"></div>Erik</div>
                    <div class="legend-item"><div class="legend-box" style="background:#8ce99a"></div>Anne</div>
                    <div class="legend-item"><div class="legend-box" style="background:#adb5bd"></div>Lene</div>
                </div>

                <div class="calendar-grid" id="calendarGrid"></div>

                <div class="bookings-list-title">Aktive bookinger i perioden</div>
                <div id="bookingsListContainer">Henter...</div>
            </div>

            <!-- TJEKLISTE VIEW -->
            <div id="checklistView" class="view-section">
                <h1>Huskeliste</h1>
                <p class="subtitle">Manual til Store Solkrog</p>

                <div class="checklist-category">Når man forlader huset</div>
                <div id="departureList"></div>

                <div class="checklist-category">Vinterlukning</div>
                <div id="winterList"></div>
            </div>
        </div>

    </div>

    <!-- BUNDNAVIGATION -->
    <div class="nav-bar">
        <button class="nav-item active" onclick="switchView('calendar', this)">
            <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
            Kalender
        </button>
        <button class="nav-item" onclick="switchView('checklist', this)">
            <svg viewBox="0 0 24 24"><path d="M9 11l3 3L22 4"></path><path d="21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path></svg>
            Huskeliste
        </button>
    </div>

    <!-- Booking Modal -->
    <div class="modal" id="bookingModal">
        <div class="modal-content">
            <h3>Opret booking eller lån</h3>
            
            <label for="userName">Dit navn</label>
            <input type="text" id="userName" placeholder="F.eks. Felix">

            <label for="userBranch">Hvilken gren tilhører du?</label>
            <select id="userBranch" onchange="checkBookingType()">
                <option value="Lene">Lenes gren</option>
                <option value="Erik">Eriks gren</option>
                <option value="Anne">Annes gren</option>
            </select>

            <label for="startDate">Fra dato</label>
            <input type="date" id="startDate" value="2026-09-01" onchange="checkBookingType()">

            <label for="endDate">Til dato</label>
            <input type="date" id="endDate" value="2026-09-07" onchange="checkBookingType()">

            <p id="bookingNotice" style="font-size: 0.85rem; color: #495057; background: #f8f9fa; padding: 12px; border-radius: 10px; margin-top: 12px; border: 1px solid #e9ecef;"></p>

            <button id="actionBtn" class="btn btn-book" onclick="submitBooking()">Bekræft booking</button>
            <button class="btn btn-close" onclick="closeModal()">Annuller</button>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://fbsgvxnqbcanciytjqzd.supabase.co';
        const SUPABASE_ANON_KEY = 'Sb_publishable_KMDFpWjd1H5E7b7IMEduZw_2LU_BE-A';

        let currentYear = 2026;
        let currentMonth = 8; // September
        const monthNames = ["Januar", "Februar", "Marts", "April", "Maj", "Juni", "Juli", "August", "September", "Oktober", "November", "December"];
        
        let existingBookings = [];

        async function fetchBookings() {
            try {
                const response = await fetch(`${SUPABASE_URL}/rest/v1/bookings?select=*`, {
                    headers: {
                        'apikey': SUPABASE_ANON_KEY,
                        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
                    }
                });
                if (response.ok) {
                    existingBookings = await response.json();
                    renderCalendar();
                    renderBookingsList();
                } else {
                    console.error("Kunne ikke hente data");
                }
            } catch (err) {
                console.error("Netværksfejl:", err);
            }
        }

        function getOwnerForDate(year, month, day) {
            const d = new Date(year, month, day);
            const onejan = new Date(d.getFullYear(), 0, 1);
            const week = Math.ceil((((d - onejan) / 86400000) + onejan.getDay() + 1) / 7);
            
            const twoWeekBlock = Math.floor((week - 1) / 2);
            const mod = twoWeekBlock % 3;

            if (mod === 0) return { name: "Erik", branch: "Erik", class: "owner-erik" };
            if (mod === 1) return { name: "Anne", branch: "Anne", class: "owner-anne" };
            return { name: "Lene", branch: "Lene", class: "owner-lene" };
        }

        function changeMonth(direction) {
            currentMonth += direction;
            if (currentMonth > 11) {
                currentMonth = 0;
                currentYear++;
            } else if (currentMonth < 0) {
                currentMonth = 11;
                currentYear--;
            }
            renderCalendar();
        }

        function isDateBooked(year, month, day) {
            const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
            return existingBookings.find(b => dateStr >= b.start_date && dateStr <= b.end_date);
        }

        function renderCalendar() {
            document.getElementById('monthTitle').innerText = `${monthNames[currentMonth]} ${currentYear}`;
            const grid = document.getElementById('calendarGrid');
            
            let html = `
                <div class="cal-header-day">Man</div>
                <div class="cal-header-day">Tirs</div>
                <div class="cal-header-day">Ons</div>
                <div class="cal-header-day">Tors</div>
                <div class="cal-header-day">Fre</div>
                <div class="cal-header-day">Lør</div>
                <div class="cal-header-day">Søn</div>
            `;

            const firstDayIndex = (new Date(currentYear, currentMonth, 1).getDay() + 6) % 7;
            const totalDays = new Date(currentYear, currentMonth + 1, 0).getDate();

            for (let i = 0; i < firstDayIndex; i++) {
                html += `<div class="cal-day empty"></div>`;
            }

            for (let day = 1; day <= totalDays; day++) {
                const ownerInfo = getOwnerForDate(currentYear, currentMonth, day);
                const booking = isDateBooked(currentYear, currentMonth, day);
                
                let dayClass = ownerInfo.class;
                let subText = ownerInfo.name;

                if (booking) {
                    dayClass = `booked-${booking.branch ? booking.branch.toLowerCase() : 'lene'}`;
                    subText = booking.user_name;
                }

                html += `
                    <div class="cal-day ${dayClass}" onclick="openModalWithDate(${currentYear}, ${currentMonth + 1}, ${day})">
                        <span class="day-number">${day}</span>
                        <span class="day-owner">${subText}</span>
                    </div>
                `;
            }
            grid.innerHTML = html;
        }

        function renderBookingsList() {
            const container = document.getElementById('bookingsListContainer');
            if (existingBookings.length === 0) {
                container.innerHTML = `<div class="booking-card" style="color: #868e96;">Ingen aktive bookinger endnu.</div>`;
                return;
            }

            container.innerHTML = existingBookings.map(b => `
                <div class="booking-card">
                    <strong>${b.user_name}</strong> (${b.branch || 'Ukendt gren'})<br>
                    📅 ${b.start_date} til ${b.end_date}
                </div>
            `).join('');
        }

        const departureTasks = [
            "Skru ned for vandvarmer til minimum (5 grader)",
            "Sluk al strøm undtagen el-varme og vandvarmer",
            "Tjek værelsesradiatorer: Tryk P (skal vise CF, ellers brug piltaster)",
            "Køleskabe (hus + skur): Slukkes, afrimes, gøres rent og efterlades med viskestykke i klemte dør",
            "Køkken/bad: Efterlad kaffe, te, olie, salt, peber, køkkenrulle, toiletpapir, sæbe m.m.",
            "Brændeovn: Fyld kurven med brænde og tøm askeskuffen (hvis sikkert)",
            "Vinduer (inkl. hems) lukkes, og tre luftventiler stilles på ca. 5 mm",
            "Skabe i værelser/under vask og døre til alle rum efterlades åbne",
            "Terrassedør låses med nøgle, og alle skure låses",
            "Vand til Store Solkrog lukkes i brønden (rør ikke Lille Solkrog) samt hovedhane før måler",
            "Betal for opholdet (husk at skrive navn på indbetaler)",
            "🧹 Gulvvask med natursæbe \"hvid\""
        ];

        const winterTasks = [
            "Frostsikring: Fjern boremaskine, batterimaskiner og malervarer fra skur til hems",
            "El-radiatorer fra hems stilles i karnap og ved terrassegavl, tilsluttes el-varme stikkontakter (* og 1)",
            "Tjek radiatorer i værelser: Tryk på P (skal vise CF)"
        ];

        function renderChecklists() {
            document.getElementById('departureList').innerHTML = departureTasks.map((task, i) => `
                <label class="checklist-item" id="dep-${i}">
                    <input type="checkbox" onchange="toggleTask('dep-${i}')"><span>${task}</span>
                </label>
            `).join('');

            document.getElementById('winterList').innerHTML = winterTasks.map((task, i) => `
                <label class="checklist-item" id="win-${i}">
                    <input type="checkbox" onchange="toggleTask('win-${i}')"><span>${task}</span>
                </label>
            `).join('');
        }

        function toggleTask(id) {
            const el = document.getElementById(id);
            if (el.querySelector('input').checked) el.classList.et.add('completed'); // Fixed typo if any
            else el.classList.remove('completed');
        }

        function switchView(name, btn) {
            document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            document.getElementById(name + 'View').classList.add('active');
            btn.classList.add('active');
        }

        function openModal() {
            document.getElementById('bookingModal').style.display = 'flex';
            checkBookingType();
        }

        function openModalWithDate(year, month, day) {
            const formattedMonth = String(month).padStart(2, '0');
            const formattedDay = String(day).padStart(2, '0');
            document.getElementById('startDate').value = `${year}-${formattedMonth}-${formattedDay}`;
            document.getElementById('endDate').value = `${year}-${formattedMonth}-${String(Math.min(day+2, 28)).padStart(2, '0')}`;
            openModal();
        }

        function closeModal() {
            document.getElementById('bookingModal').style.display = 'none';
        }

        function checkBookingType() {
            const start = new Date(document.getElementById('startDate').value);
            const end = new Date(document.getElementById('endDate').value);
            const selectedBranch = document.getElementById('userBranch').value;
            const notice = document.getElementById('bookingNotice');
            const btn = document.getElementById('actionBtn');

            let crossesOther = false;
            let current = new Date(start);
            while(current <= end) {
                const owner = getOwnerForDate(current.getFullYear(), current.getMonth(), current.getDate());
                if(owner.branch !== selectedBranch) {
                    crossesOther = true;
                }
                current.setDate(current.getDate() + 1);
            }

            if(crossesOther) {
                notice.innerHTML = "⚠️ Perioden overlapper med en anden grens uger. Der sendes automatisk en anmodning om lån.";
                btn.innerText = "Send anmodning";
                btn.className = "btn btn-request";
            } else {
                notice.innerHTML = "✅ Perioden ligger i din egen grens uger. Bookes med det samme.";
                btn.innerText = "Bekræft booking";
                btn.className = "btn btn-book";
            }
        }

        async function submitBooking() {
            const userName = document.getElementById('userName').value;
            const userBranch = document.getElementById('userBranch').value;
            const startDate = document.getElementById('startDate').value;
            const endDate = document.getElementById('endDate').value;

            if(!userName) { alert("Indtast venligst dit navn."); return; }

            try {
                const response = await fetch(`${SUPABASE_URL}/rest/v1/bookings`, {
                    method: 'POST',
                    headers: {
                        'apikey': SUPABASE_ANON_KEY,
                        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
                        'Content-Type': 'application/json',
                        'Prefer': 'return=minimal'
                    },
                    body: JSON.stringify({
                        user_name: userName,
                        branch: userBranch,
                        start_date: startDate,
                        end_date: endDate
                    })
                });

                if (response.ok) {
                    alert(`Booking gennemført for ${userName} (${userBranch}s gren)!`);
                    closeModal();
                    document.getElementById('userName').value = '';
                    fetchBookings();
                } else {
                    const errText = await response.text();
                    alert("Kunne ikke gemme: " + errText);
                }
            } catch (err) {
                alert("Fejl ved oprettelse: " + err.message);
            }
        }

        fetchBookings();
        renderChecklists();
    </script>
</body>
</html>
